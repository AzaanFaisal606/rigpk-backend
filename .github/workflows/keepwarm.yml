name: Keep API warm

# Render's free dyno spins down after ~15 min idle, and the first request
# afterwards fails the connection outright (http=000) before recovering. That
# cold start is the root cause of two reported bugs: the empty /trends page
# after a deploy (Next prerenders against a dead dyno and caches the empty
# result for 300s) and the intermittent "search returns nothing".
#
# A ping every 10 minutes keeps the dyno up. This is deliberately not gated on
# DEBUG_MODE — it performs no writes and reads no secrets.
#
# SCHEDULE DISABLED (2026-09-20). It performs no writes, but /api/stats is not
# free to serve: it used to count every row of price_log on each call, so
# 144 pings a day cost roughly 341 million Turso row reads a month — about
# two thirds of the 500M free allowance, spent entirely on keeping a dyno
# awake for nobody. /api/stats is cheap now (cached count + in-process TTL
# cache), but at 76 visits a quarter a cold start on the rare real request is
# a better trade than 4,320 synthetic ones. Re-enable the cron below if
# traffic ever justifies it.
on:
  # schedule:
  #   - cron: "*/10 * * * *"
  workflow_dispatch:

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping the API
        run: |
          for attempt in 1 2 3; do
            code=$(curl -s -o /dev/null -w "%{http_code}" --max-time 30 \
              https://ppc-pakistan.onrender.com/api/stats || echo "000")
            echo "attempt $attempt: HTTP $code"
            [ "$code" = "200" ] && exit 0
            sleep 20
          done
          echo "API did not return 200 after 3 attempts"
          exit 1
