name: Self-Heal

# Fires after "Weekly Scrape" finishes FAILED — which now includes the small
# stuff: a failed source, a suspicious count drop, or a category that scraped
# zero (run_all/run_prebuilts run with --strict). Diagnoses the break and opens
# a PR for review. Never pushes to master.
on:
  workflow_run:
    # Fires on either the weekly scrape OR a heal rerun that still failed, so a
    # bad fix loops back into another diagnosis (each cycle still gated by your
    # merge — never an unattended loop).
    workflows: ["Weekly Scrape", "Heal Rerun"]
    types: [completed]
  # Manual trigger, for testing this workflow against a known failed run without
  # waiting for the weekly cron. `gh run rerun` replays the OLD definition at the
  # triggering commit, so it can't test edits made here — dispatch is the only way.
  workflow_dispatch:
    inputs:
      run_id:
        description: "ID of the failed Weekly Scrape run to diagnose"
        required: true
        type: string
      dry_run:
        description: "Diagnose only — do not create a branch or open a PR"
        required: false
        type: boolean
        default: true

# One heal at a time; a newer failure supersedes an in-flight heal.
concurrency:
  group: self-heal
  cancel-in-progress: true

permissions:
  contents: write        # create the fix branch
  pull-requests: write   # open the PR
  actions: read          # read the failed run's logs

jobs:
  heal:
    # Fire on failure OR cancelled. A timeout / hung run ends "cancelled", not
    # "failure" — Claude may find nothing to fix there, but the PR (or its job
    # output) still flags that a run broke instead of dying silently. A green
    # scrape never triggers this.
    #
    # DEBUG_MODE (repo variable) short-circuits this entirely: while debugging
    # scrapers, a dry-run failure must NOT open PRs. Set it 'false'/delete to
    # re-enable self-heal.
    # On workflow_dispatch there is no github.event.workflow_run, so every field
    # below is empty and the conclusion check can never pass — the dispatch arm
    # is what lets a manual run through.
    if: >
      vars.DEBUG_MODE != 'true' &&
      (github.event_name == 'workflow_dispatch' ||
       github.event.workflow_run.conclusion == 'failure' ||
       github.event.workflow_run.conclusion == 'cancelled')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pull the failed run's logs into a file for Claude to read. --log-failed
      # is the failed steps only; fall back to the full log if that's empty.
      - name: Fetch failed scrape logs
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.event.workflow_run.id || inputs.run_id }}
        run: |
          {
            echo "Failed run: ${{ github.repository }} run $RUN_ID"
            echo "Head SHA:   ${{ github.event.workflow_run.head_sha || github.sha }}"
            echo "==================== LOGS ===================="
            gh run view "$RUN_ID" --repo "${{ github.repository }}" --log-failed 2>/dev/null \
              || gh run view "$RUN_ID" --repo "${{ github.repository }}" --log 2>/dev/null \
              || echo "(could not fetch logs)"
          } > scrape_failure.log
          echo "wrote $(wc -l < scrape_failure.log) lines"

      - name: Claude diagnose + open PR
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          claude_args: "--max-turns 40 --model claude-opus-4-8"
          # Without this the SDK output is redacted to "full output hidden for
          # security" and an auth/API failure shows only is_error:true with no
          # message — which made the 2026-07-31 failure undiagnosable from logs.
          show_full_output: true
          prompt: |
            ${{ (github.event_name == 'workflow_dispatch' && inputs.dry_run) && 'DRY RUN: diagnose only. Do NOT create a branch, commit, or open a pull request. Write your diagnosis to the job output and stop. This overrides step 4 and the branch-naming rules below.' || '' }}

            The weekly price scrape did not finish green. It either FAILED (a
            scraper exited non-zero on an anomaly) or was CANCELLED (a job hit its
            timeout / hung). Its logs are in ./scrape_failure.log at the repo root.

            Do this:
            1. Read scrape_failure.log and find the "ANOMALIES DETECTED" section plus any
               "SCRAPER FAILED" / "BLOCKED" / "WARNING" lines. Identify exactly which
               source(s) or (source/category) broke and the root cause.
            2. Locate the cause in the scrapers/ code (a scraper is one module under
               scrapers/<name>/). Common causes: a retailer changed its HTML/JSON layout,
               a category slug/URL changed, or a selector/regex no longer matches.
            3. Make the SMALLEST correct fix. Do not refactor unrelated code. Do not touch
               db/, backend/, or the workflow files.
            4. Create a new branch and commit the fix, then open a pull request against
               master with a title summarising what broke and a body explaining the
               anomaly, the root cause, and the fix.

               The branch name MUST be exactly:  heal/<kind>-<key>-<short-desc>
               where <kind> is "parts" or "prebuilt" and <key> is the scraper key from
               this table (map the broken retailer's domain to its key+kind):

                 parts:    czone.com.pk=czone  zahcomputers.pk=zah  amdhouse.pk=amd
                           rbtechngames.com=rbt  junaidtech.pk=junaid  techarc.pk=tech
                           pakbyte.pk=pakbyte  redtech.pk=redtech  techmatched.pk=techmatched
                 prebuilt: zestrogaming.com=zestro  redtech.pk=redtech  techmatched.pk=techmatched

               Example: heal/parts-techmatched-ram-slug-fix
               This exact format matters: merging the PR auto-reruns that one scraper.
               If several sources broke, fix the most impactful one in this PR.
            5. If the anomaly is legitimate and needs NO code change (e.g. a retailer
               genuinely sold out of a category, or a real one-off block), do NOT open a
               PR — just write your reasoning to the job output and stop.
            6. If the run was CANCELLED by a timeout with no fixable code cause (a
               source was merely slow, not broken), there is nothing to patch — say
               so plainly in the job output and stop. Do not open a PR for a timeout.

            Hard rules:
            - Never push to master. Only ever open a PR.
            - Do NOT add any AI/assistant attribution anywhere: no "Generated with",
              no "Co-authored-by", no mention of Claude/AI in the branch name, commit
              message, or PR title/body. Write them as a normal human contributor would.
            - Keep the change minimal and scoped to the broken scraper.
