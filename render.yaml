services:
  - type: web
    name: rigpk-api
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn backend.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: FRONTEND_URL
        sync: false
      # Values live in the Render dashboard, never in git. Without these
      # declared, a render.yaml-driven deploy serves an empty SQLite DB with
      # HTTP 200 instead of failing loudly.
      - key: TURSO_DATABASE_URL
        sync: false
      - key: TURSO_AUTH_TOKEN
        sync: false
